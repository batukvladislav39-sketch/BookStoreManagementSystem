
{% extends "base.html" %}
{% block title %}{{ page_title }} — BookAbyss{% endblock %}

{% block content %}
<section class="form-wrap wide-form">
    <div class="panel form-panel">
        <h1>{{ page_title }}</h1>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}

                    {% for error in field.errors %}
                        <p class="field-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="actions">
                <button class="button" type="submit">Зберегти</button>
                <a class="button button-secondary"
                   href="{% url 'book_list' %}">
                    Скасувати
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
